services:
  better-youtube:
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://localhost:8447/health',context=ssl._create_unverified_context(),timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "${BETTER_BIND_IP}:8447:8447"
    env_file: .env
    environment:
      BETTER_DATA: /data
    volumes:
      - ./state:/data
      - ./tls:/tls:ro
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 80
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
